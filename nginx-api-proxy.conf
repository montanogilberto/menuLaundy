# Add this block inside your server {} block for gmolavanderia.com
# It proxies /api/* to the Azure backend, adding CORS headers server-side
# so the browser never makes a cross-origin request.

location /api/ {
    # Strip /api prefix and forward to Azure
    proxy_pass https://smartloansbackend.azurewebsites.net/;
    proxy_ssl_server_name on;
    proxy_set_header Host smartloansbackend.azurewebsites.net;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Handle OPTIONS preflight
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' 'https://www.gmolavanderia.com' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type' always;
        add_header 'Access-Control-Max-Age' 86400 always;
        add_header 'Content-Length' 0;
        return 204;
    }

    add_header 'Access-Control-Allow-Origin' 'https://www.gmolavanderia.com' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Content-Type' always;
}
